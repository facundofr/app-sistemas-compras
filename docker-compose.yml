# Producción: base de datos + aplicación + Caddy (HTTPS automático).
# Uso:  docker compose up -d --build
# Toda la configuración está en el archivo .env (ver .env.example).

# Nombre fijo: no depende de la carpeta y no choca con docker-compose.dev.yml.
name: pedidos-sistemas

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pedidos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Definí POSTGRES_PASSWORD en .env}
      POSTGRES_DB: ${POSTGRES_DB:-pedidos}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    image: pedidos-sistemas:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-pedidos}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-pedidos}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@pedidos.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_NOMBRE: ${ADMIN_NOMBRE:-Administrador}
      COOKIE_SECURE: ${COOKIE_SECURE:-}
      TZ: America/Argentina/Buenos_Aires
      # Opcionales (ver .env.example): vacíos, la función correspondiente queda apagada.
      APP_URL: ${APP_URL:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_SECURE: ${SMTP_SECURE:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      ML_CLIENT_ID: ${ML_CLIENT_ID:-}
      ML_CLIENT_SECRET: ${ML_CLIENT_SECRET:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
    volumes:
      - uploads:/app/uploads
    # Solo accesible desde el propio servidor; al público se sale por Caddy.
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    environment:
      DOMAIN: ${DOMAIN:-:80}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  uploads:
  caddy_data:
  caddy_config:
