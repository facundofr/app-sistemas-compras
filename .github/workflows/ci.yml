# Chequeos automáticos en cada push y pull request: si algo falla, GitHub lo marca en rojo.
name: CI

on:
  push:
  pull_request:

jobs:
  chequeos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Tipos
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Tests unitarios
        run: npm test

  e2e:
    # La app completa contra un PostgreSQL de verdad, manejada con un navegador.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: pedidos
          POSTGRES_PASSWORD: pedidos
          POSTGRES_DB: pedidos
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U pedidos" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      E2E_DATABASE_URL: postgres://pedidos:pedidos@localhost:5433/pedidos_e2e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build de producción
        run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Tests de punta a punta
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7
